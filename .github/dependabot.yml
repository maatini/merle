# =============================================================================
# Dependabot configuration for Merle (uv + GitHub Actions)
# =============================================================================
# Python deps use the uv ecosystem so Dependabot updates pyproject.toml and
# uv.lock together. The pip ecosystem only edits version ranges and leaves
# uv.lock stale, which fails `uv lock --check` in CI.
# Docs: https://docs.astral.sh/uv/guides/integration/dependabot/
# =============================================================================

version: 2
updates:
  # GitHub Actions (critical for CI security)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"

  # Python (uv) — updates manifest constraints and regenerates uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
    # Ignore very frequent or breaking updates during Phase 2/3 stabilization
    ignore:
      - dependency-name: "ruff"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mypy"
        update-types: ["version-update:semver-major"]
