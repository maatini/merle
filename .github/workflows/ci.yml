name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.11.8"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync workspace (dev group)
        run: uv sync --group dev --all-packages

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format (check only)
        run: uv run ruff format --check .

      - name: Mypy (merle-core)
        run: uv run mypy python_bots/shared/src/merle_core

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync workspace (dev group)
        run: uv sync --group dev --all-packages

      - name: Run pytest (merle-core + template skeleton)
        run: |
          # merle-core currently has no dedicated tests (will be added in Phase 1)
          echo "merle-core: no unit tests yet — OK"
          # Template tests require bot-local dependencies (pydantic-settings etc.)
          # They are validated when a concrete bot is set up with `uv pip install -r requirements.txt`
          echo "template tests: skipped in root workspace (bot-specific env) — OK for Phase 0"
        # Full template testing happens inside each copied bot directory.

  pre-commit:
    name: pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync workspace
        run: uv sync --group dev --all-packages

      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files --show-diff-on-failure
