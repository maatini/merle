name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  UV_VERSION: "0.11.8"

jobs:
  # ---------------------------------------------------------------------------
  # Matrix job: Lint + Type + Test across Python versions (3.11 + 3.12)
  # ---------------------------------------------------------------------------
  quality:
    name: "Quality (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Lockfile check
        run: uv lock --check

      - name: Sync dev workspace
        # --all-extras: merle-core tests import optional modules (pandas, otel, secrets, …)
        run: uv sync --group dev --all-packages --all-extras

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (merle-core, strict)
        run: uv run mypy packages/merle-core/src/merle_core --strict

      - name: Pytest (merle-core)
        run: uv run pytest packages/merle-core -q --tb=short --cov=merle_core --cov-fail-under=70 --cov-report=term-missing

      - name: Run merle validate (governance)
        # --strict gates mypy + bandit; bandit is also in Security job but validate
        # needs it on PATH under --strict (uv run bandit → exit 1 if missing).
        run: |
          uv pip install "bandit[toml]" --quiet
          uv run merle validate --strict

  # ---------------------------------------------------------------------------
  # Security (Bandit + Trivy FS + basic secret scan)
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so TruffleHog can resolve push before/after and PR base
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"

      - name: Sync (dev + security tools)
        run: uv sync --group dev --all-packages --all-extras

      # Bandit -ll (medium+): blocking; High/Medium findings fail the job
      - name: Bandit (Python SAST)
        run: |
          uv pip install bandit[toml] --quiet
          uv run bandit -c pyproject.toml -r packages/merle-core/src/merle_core tools/merle -ll

      # HARD: fail on fixable CRITICAL/HIGH (ignore-unfixed keeps unfixed noise non-blocking)
      - name: Trivy filesystem scan (IaC + deps)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          format: "table"
          scan-ref: "."
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      # HARD: event-aware secret scan. Do NOT set base/head — on push to main that
      # makes BASE==HEAD and the action fails without scanning. Omit base/head so
      # the action picks PR base/head or push before/after. --fail is already set
      # by the action; do not pass it again via extra_args (duplicate flag error).
      - name: Detect secrets
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          path: ./
          version: v3.95.9

  # ---------------------------------------------------------------------------
  # Pre-commit (full) + changed-file prettier
  # ---------------------------------------------------------------------------
  pre-commit:
    name: pre-commit + Formatters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for changed-file detection)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true

      - name: Sync + pre-commit cache
        run: uv sync --group dev --all-packages --all-extras

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run full pre-commit suite
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Prettier on changed non-Python files
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref || 'main' }} --depth=1 || true
          CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref || 'main' }}...HEAD -- '*.md' '*.yaml' '*.yml' '*.json' '*.toml' 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED" | xargs npx --yes prettier@3.3.3 --check || (echo "Prettier issues — run locally: npx prettier --write" && exit 1)
          fi

  # ---------------------------------------------------------------------------
  # Docker template validation (re-uses docker-build.yml logic)
  # ---------------------------------------------------------------------------
  docker-validate:
    name: Docker Template Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      - name: Generate fresh bot + build (monorepo pattern)
        run: |
          # Generate INTO the workspace so Docker context (repo root) can COPY the bot.
          # Directory name == bot_name so default BOT_PATH matches.
          rm -rf python_bots/ci_bot
          uvx copier copy --trust templates/bot python_bots/ci_bot \
            --data bot_name=ci_bot \
            --data location=python_bots \
            --data include_playwright=true \
            --defaults \
            --overwrite \
            --quiet
          docker build \
            -f python_bots/ci_bot/Dockerfile \
            --build-arg BUILD_MODE=monorepo \
            --build-arg BOT_PATH=python_bots/ci_bot \
            -t merle-ci-bot:test \
            .
          echo "✅ Generated bot Docker build succeeded (monorepo)"
        # Full matrix + Trivy moved to dedicated docker-build.yml for PRs on template changes

# =============================================================================
# Branch Protection (required status checks — configure in GitHub UI):
#   - "Quality (py3.11)" and "Quality (py3.12)"
#   - "Security Scan"
#   - "pre-commit + Formatters"
#   - "Docker Template Validation"
# All must pass before merge to main.
# =============================================================================
