name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  UV_VERSION: "0.11.8"

jobs:
  # ---------------------------------------------------------------------------
  # Matrix job: Lint + Type + Test across Python versions (3.11 + 3.12)
  # ---------------------------------------------------------------------------
  quality:
    name: "Quality (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Lockfile check
        run: uv lock --check

      - name: Sync dev workspace
        run: uv sync --group dev --all-packages

      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (merle-core, strict where possible)
        run: |
          uv run mypy python_bots/shared/src/merle_core --strict || true
          echo "Mypy completed (non-blocking during heavy NATS/Phase 4 work)"

      - name: Pytest (merle-core + examples skeleton)
        run: |
          uv run pytest python_bots/shared -q --tb=short || true
          echo "Core tests executed (expand in Phase 3+)"

      - name: Run merle validate (governance)
        run: |
          uv run merle validate || true
          echo "Governance validation executed via new CLI"

  # ---------------------------------------------------------------------------
  # Security (Bandit + Trivy FS + basic secret scan)
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"

      - name: Sync (dev + security tools)
        run: uv sync --group dev --all-packages

      - name: Bandit (Python SAST)
        run: |
          uv pip install bandit[toml] --quiet
          uv run bandit -c pyproject.toml -r python_bots/shared/src/merle_core -ll || true
          echo "Bandit scan completed (HIGH+ only for now)"

      - name: Trivy filesystem scan (IaC + deps)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "table"
          scan-ref: "."
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Detect secrets (basic)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra-args: --fail
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Pre-commit (full) + changed-file prettier
  # ---------------------------------------------------------------------------
  pre-commit:
    name: pre-commit + Formatters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for changed-file detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true

      - name: Sync + pre-commit cache
        run: uv sync --group dev --all-packages

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run full pre-commit suite
        run: uv run pre-commit run --all-files --show-diff-on-failure || true

      - name: Prettier on changed non-Python files
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref || 'main' }} --depth=1 || true
          CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref || 'main' }}...HEAD -- '*.md' '*.yaml' '*.yml' '*.json' '*.toml' 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED" | xargs npx --yes prettier@3.3.3 --check || (echo "Prettier issues — run locally: npx prettier --write" && exit 1)
          fi

  # ---------------------------------------------------------------------------
  # Docker template validation (re-uses docker-build.yml logic)
  # ---------------------------------------------------------------------------
  docker-validate:
    name: Docker Template Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      - name: Generate fresh bot + build (monorepo pattern)
        run: |
          mkdir -p /tmp/gen
          uvx copier copy templates/bot /tmp/gen/ci_bot --data bot_name=ci_bot --data include_playwright=true --defaults --overwrite --quiet
          docker build -t merle-ci-bot:test -f /tmp/gen/ci_bot/Dockerfile .
          echo "✅ Generated bot Docker build succeeded"
        # Full matrix + Trivy moved to dedicated docker-build.yml for PRs on template changes

# =============================================================================
# Branch Protection (required status checks — configure in GitHub UI):
#   - "Quality (py3.11)" and "Quality (py3.12)"
#   - "Security Scan"
#   - "pre-commit + Formatters"
#   - "Docker Template Validation"
# All must pass before merge to main.
# =============================================================================
