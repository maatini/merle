name: Docker Build & Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'python_bots/template/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'python_bots/template/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/maatini/merle-bot-template
  TRIVY_VERSION: "0.59.0"

jobs:
  build-and-scan:
    name: Build Template Image + Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (template)
        uses: docker/build-push-action@v6
        with:
          context: python_bots/template
          file: python_bots/template/Dockerfile
          load: true
          tags: merle-bot-template:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'merle-bot-template:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'   # Only fail on unfixed CRITICAL vulnerabilities

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Trivy filesystem scan (IaC / Dockerfile)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          scan-ref: 'python_bots/template'
          exit-code: '0'   # Non-blocking for now, informational

      - name: (Optional) Push to GHCR on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push step would go here in a real release workflow (omitted for Phase 0 to keep simple)
