name: Docker Build & Security Scan

on:
  push:
    branches: [main, develop]
    paths:
      - "templates/bot/**"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "templates/bot/**"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.11.8"

jobs:
  # =====================================================================
  # Primary: Validate that a freshly generated bot builds in Docker (monorepo pattern)
  # This is the real test of the professional template + Dockerfile.jinja
  # =====================================================================
  build-generated-bot:
    name: Build Generated Bot (Monorepo Pattern)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate a fresh test bot from Copier template
        run: |
          mkdir -p /tmp/generated-bots
          uvx copier copy --trust templates/bot /tmp/generated-bots/test_docker_bot \
            --data bot_name=test_docker_bot \
            --data bot_description="CI validation bot" \
            --data include_pandas=true \
            --data use_base_bot_class=true \
            --data location=python_bots \
            --defaults \
            --overwrite \
            --quiet
          echo "Generated bot at /tmp/generated-bots/test_docker_bot"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build generated bot using monorepo pattern (context = repo root)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: /tmp/generated-bots/test_docker_bot/Dockerfile
          build-args: |
            BUILD_MODE=monorepo
          load: true
          tags: merle-generated-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

      - name: Verify image was built successfully
        run: |
          docker images | grep merle-generated-bot
          echo "✅ Docker build of generated bot succeeded (monorepo pattern)"

  # =====================================================================
  # Legacy: Keep scanning the old snapshot for now (will be removed later)
  # =====================================================================
  legacy-template-scan:
    name: Legacy Template Snapshot + Trivy (informational)
    runs-on: ubuntu-latest
    needs: build-generated-bot
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build legacy template snapshot (for comparison)
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: python_bots/template
          file: python_bots/template/Dockerfile
          load: true
          tags: merle-legacy-template:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

      - name: Trivy filesystem scan on Copier template (IaC + Dockerfile best practices)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "table"
          scan-ref: "templates/bot"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Trivy on legacy snapshot image (informational only)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: "merle-legacy-template:test"
          format: "sarif"
          output: "legacy-trivy-results.sarif"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload legacy Trivy results (if any)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: "legacy-trivy-results.sarif"

