name: Docker Build & Security Scan

on:
  push:
    branches: [main, develop]
    paths:
      - "templates/bot/**"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "templates/bot/**"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.11.8"

jobs:
  # =====================================================================
  # Primary: Validate that a freshly generated bot builds in Docker (monorepo pattern)
  # This is the real test of the professional template + Dockerfile.jinja
  # =====================================================================
  build-generated-bot:
    name: Build Generated Bot (Monorepo Pattern)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate a fresh test bot from Copier template
        run: |
          # Generate INTO the workspace so Docker context (repo root) can COPY the bot.
          rm -rf python_bots/test_docker_bot
          uvx copier copy --trust templates/bot python_bots/test_docker_bot \
            --data bot_name=test_docker_bot \
            --data bot_description="CI validation bot" \
            --data include_pandas=true \
            --data use_base_bot_class=true \
            --data location=python_bots \
            --defaults \
            --overwrite \
            --quiet
          echo "Generated bot at python_bots/test_docker_bot"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build generated bot using monorepo pattern (context = repo root)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: python_bots/test_docker_bot/Dockerfile
          build-args: |
            BUILD_MODE=monorepo
            BOT_PATH=python_bots/test_docker_bot
          load: true
          tags: merle-generated-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

      - name: Build generated bot using standalone wheel fallback (monorepo context)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: python_bots/test_docker_bot/Dockerfile
          build-args: |
            BUILD_MODE=standalone
            BOT_PATH=python_bots/test_docker_bot
          load: true
          tags: merle-generated-bot:standalone-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

      - name: Verify images were built successfully
        run: |
          docker images | grep merle-generated-bot
          docker run --rm --entrypoint python merle-generated-bot:test -c "import merle_core; print('monorepo ok')"
          docker run --rm --entrypoint python merle-generated-bot:standalone-test -c "import merle_core; print('standalone ok')"
          echo "✅ Docker builds of generated bot succeeded (monorepo + standalone wheel)"

