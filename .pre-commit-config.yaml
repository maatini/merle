# pre-commit configuration for Merle RPA
# Run locally: uv run pre-commit install
# Or: pre-commit run --all-files

repos:
  # Ruff: Linting + Auto-fix (replaces flake8, isort, pyupgrade, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Mypy: Temporarily disabled as blocking pre-commit hook during heavy refactoring (Phase 3/4).
  # Mypy is still run in the dedicated CI job (non-fatal for now).
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.15.2
  #   hooks:
  #     - id: mypy
  #       args:
  #         - "--strict"
  #         - "--no-error-summary"
  #         - "--show-error-codes"
  #       files: ^packages/merle-core/src/
  #       additional_dependencies:
  #         - "loguru>=0.7"
  #         - "tenacity>=8.0"
  #         - "httpx>=0.25"
  #         - "pydantic>=2.0"

  # Prettier: Format YAML, Markdown, JSON, TOML (non-Python files)
  # Using rbubley maintained fork which provides stable v3.3.3 tag (original mirrors-prettier lacks v3.3.x tags)
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        types_or: [yaml, markdown, json, toml]
        exclude: |
          (?x)^(
              rpa-opencode-hybrid/.*|
              .*\.lock|
              .*\.sql
          )$

  # Commitizen: Enforce Conventional Commits (feat, fix, docs, refactor, test, chore, etc.)
  # Local: after `uv sync --group dev`, run `uv run pre-commit install`
  # To commit: `git cz` (interactive) or normal `git commit` (hook validates)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.2
    hooks:
      - id: commitizen
        stages: [commit-msg]
