[project]
name = "merle-example-excel"
version = "0.1.0"
description = "Light Excel processing example (Merle BaseTask + pydantic-settings)"
requires-python = ">=3.11"
dependencies = [
    "merle-core[observability,data]>=0.2.0",
    "pydantic-settings>=2.0",
]

[tool.uv.sources]
merle-core = { path = "../../packages/merle-core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
