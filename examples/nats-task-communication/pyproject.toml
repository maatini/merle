[project]
name = "merle-nats-task-communication"
version = "0.1.0"
description = "Gold-standard NATS TaskSpec/TaskResult communication example"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "merle-core[nats]>=0.2.0",
    "pydantic-settings>=2.0",
]

[tool.uv.sources]
merle-core = { path = "../../packages/merle-core", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["nats.*", "loguru.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: live NATS server tests",
]
