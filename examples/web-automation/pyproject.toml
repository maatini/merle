[project]
name = "merle-web-automation"
version = "0.1.0"
description = "Gold-standard web automation bot using Merle (Playwright + BaseBot)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "merle-core[playwright,observability]>=0.2.0",
    "pydantic-settings>=2.0",
]

[tool.uv.sources]
merle-core = { path = "../../packages/merle-core", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["playwright.*", "loguru.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: live browser / network tests",
]
