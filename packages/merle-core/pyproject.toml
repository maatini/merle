[project]
name = "merle-core"
version = "0.5.1"
description = "Core utilities, resilience patterns and observability for Merle RPA bots"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    { name = "Martin Richardt", email = "martin.richardt@maatini.space" },
]

dependencies = [
    "loguru>=0.7,<1.0",
    "tenacity>=8.0,<9.0",
    "httpx>=0.25,<1.0",
    "pydantic>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merle_core"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
# Ruff config inherited from root workspace via uv, but local overrides possible
target-version = "py311"
line-length = 120

[project.optional-dependencies]
playwright = [
    "playwright>=1.40,<2.0",
]
lightpanda = [
    "lightpanda-py>=0.2.0,<1.0",
    "playwright>=1.40,<2.0",
]
azure = [
    "azure-identity>=1.16,<2.0",
    "azure-keyvault-secrets>=4.8,<5.0",
    "pydantic-settings>=2.0,<3.0",
]
observability = [
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp>=1.25,<2.0",
]
data = [
    "pandas>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
    "pdfplumber>=0.10,<1.0",
]
nats = [
    "nats-py>=2.7,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13,<1.0",
    "mypy>=2.1.0,<3.0",
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.3.0,<2.0",
    "pytest-cov>=5.0,<6.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

# Optional / external dependencies (not installed in all CI jobs)
[[tool.mypy.overrides]]
module = [
    "pydantic_settings.*",
    "nats.*",
    "azure.identity.*",
    "azure.keyvault.secrets.*",
    "pandas.*",
    "openpyxl.*",
]
ignore_missing_imports = true

# NATS client is still maturing (Phase 4) — keep relaxed until stable API
[[tool.mypy.overrides]]
module = "merle_core.nats.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_unreachable = false
ignore_errors = true  # Phase 4 maturing

[[tool.mypy.overrides]]
module = "lightpanda.*"
ignore_missing_imports = true
