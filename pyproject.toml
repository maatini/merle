[project]
name = "merle"
version = "0.2.0"
description = "Modular Enterprise RPA Lifecycle Engine — Python-first hybrid RPA framework"
authors = [
    { name = "Martin Richardt", email = "martin.richardt@gmail.com" },
]
requires-python = ">=3.11"
license = {text = "Proprietary"}
readme = "README.md"

[tool.uv.workspace]
members = [
    "python_bots/shared",
    "tools/merle",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-playwright>=0.4,<1.0",
    "pre-commit>=3.7,<4.0",
    "commitizen>=3.29,<4.0",   # Conventional Commits + SemVer + CHANGELOG
]

# ─── Ruff ───────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "RUF",    # Ruff-spezifische Regeln
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"templates/bot/hooks/post_gen_project.py" = ["T201"]  # Intentional prints in Copier hook

[tool.ruff.lint.isort]
known-first-party = ["merle", "merle_core"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

# ─── Mypy ───────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "rpaframework.*",
    "playwright.*",
    "lightpanda.*",
    "loguru.*",
    "tenacity.*",
]
ignore_missing_imports = true

# ─── Pytest ─────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
testpaths = ["python_bots"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: langsamer Test (deselect mit '-m \"not slow\"')",
    "integration: Integrationstest mit externen Abhängigkeiten",
    "e2e: End-to-End-Test mit Playwright",
]

# ─── Commitizen (Conventional Commits + SemVer + auto-CHANGELOG) ─────────────
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
version_files = [
    "pyproject.toml:version",
    "python_bots/shared/pyproject.toml:version",
    "tools/merle/pyproject.toml:version",
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
# Use "git cz" or "cz commit" locally after `uv run cz`
# pre-commit hook below enforces conventional format on commit
