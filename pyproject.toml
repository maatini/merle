[project]
name = "merle"
version = "0.7.1"
description = "Modular Enterprise RPA Lifecycle Engine — Python-first hybrid RPA framework"
authors = [
    { name = "Martin Richardt", email = "martin.richardt@maatini.space" },
]
requires-python = ">=3.11"
license = {text = "Proprietary"}
readme = "README.md"

[tool.uv.workspace]
members = [
    "packages/merle-core",
    "tools/merle",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1,<1.0",
    "mypy>=2.3.0,<3.0",
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-playwright>=0.8.0,<1.0",
    "pre-commit>=4.6.1,<5.0",
    "commitizen>=4.16.5,<5.0",   # Conventional Commits + SemVer + CHANGELOG
]

# ─── Ruff ───────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "RUF",    # Ruff-spezifische Regeln
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "B027",   # Empty optional hooks on BaseBot/BaseTask (intentional overridable no-ops)
    "RUF001", # Ambiguous unicode in strings (German docs use en-dash)
    "RUF002", # Ambiguous unicode in docstrings
    "RUF003", # Ambiguous unicode in comments
    "SIM105", # try/except/pass preferred over contextlib.suppress in cleanup paths
    "SIM117", # Nested with is clearer in some tests/fixtures
    "UP042",  # str, Enum still fine; StrEnum migration optional
]

[tool.ruff.lint.per-file-ignores]
"templates/bot/hooks/post_gen_project.py" = ["T201"]  # Intentional prints in Copier hook

[tool.ruff.lint.isort]
known-first-party = ["merle", "merle_core"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

# ─── Mypy ───────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "lightpanda.*",
    "loguru.*",
    "tenacity.*",
    "pandas.*",
    "openpyxl.*",
    "pydantic_settings.*",
    "nats.*",
    "azure.identity.*",
    "azure.keyvault.secrets.*",
]
ignore_missing_imports = true

# NATS client is still maturing (Phase 4) — keep relaxed until stable API
[[tool.mypy.overrides]]
module = "merle_core.nats.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_unreachable = false
ignore_errors = true  # Phase 4 maturing

# ─── Pytest ─────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
testpaths = ["packages/merle-core", "examples"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: langsamer Test (deselect mit '-m \"not slow\"')",
    "integration: Integrationstest mit externen Abhängigkeiten",
    "e2e: End-to-End-Test mit Playwright",
]

# ─── Commitizen (Conventional Commits + SemVer + auto-CHANGELOG) ─────────────
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.7.1"
version_files = [
    "pyproject.toml:version",
    "packages/merle-core/pyproject.toml:version",
    "tools/merle/pyproject.toml:version",
    "packages/merle-core/src/merle_core/__init__.py:__version__",
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
# Use "git cz" or "cz commit" locally after `uv run cz`
# pre-commit hook below enforces conventional format on commit
