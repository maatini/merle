[project]
name = "merle-bot-template"
version = "0.1.0"
description = "Verbindliches Template für neue Merle RPA-Bots (Python-first)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    # Core shared library (from workspace)
    "merle-core",

    # Konfiguration
    "pydantic-settings>=2.0,<3.0",

    # Logging & Resilience
    "loguru>=0.7,<1.0",
    "tenacity>=8.0,<9.0",

    # HTTP (async)
    "httpx>=0.25,<1.0",

    # --- Häufig benötigte Pakete (bei Bedarf auskommentieren) ---
    # "pandas>=2.0,<3.0",
    # "openpyxl>=3.1,<4.0",
    # "pdfplumber>=0.10,<1.0",

    # --- RPA-spezifisch (nur bei echtem Bedarf hinzufügen) ---
    # "rpaframework>=28.0,<29.0",   # Legacy Desktop / UiPath Python Scope
    # "playwright>=1.40,<2.0",      # Web-Automatisierung (besser als rpaframework)
]

[tool.uv.sources]
# Für die Entwicklung innerhalb dieses Monorepos (empfohlen):
# Der relative Pfad funktioniert, solange der Bot unter python_bots/<name>/ liegt.
merle-core = { path = "../shared" }

# Für echte Standalone-Bots (später):
# - merle-core in internem PyPI veröffentlichen
# - dann: "merle-core>=0.1.0" ohne sources-Eintrag verwenden
# - oder: merle-core @ git+https://...#subdirectory=python_bots/shared


[dependency-groups]
dev = [
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-playwright>=0.4,<1.0",
]

# ─────────────────────────────────────────────────────────────
# Tooling (vererbt sich idealerweise aus dem Root-Workspace,
# hier lokale Defaults für Bots die außerhalb des Monorepos gebaut werden)
# ─────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF", "T20", "PT"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
ignore_missing_imports = true   # für rpaframework, playwright etc. in konkreten Bots

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
testpaths = ["tests"]
