[project]
name = "merle-cli"
version = "0.7.1"
description = "Merle RPA CLI – Schnellstart für neue Bots"
authors = [
    { name = "Martin Richardt", email = "martin.richardt@maatini.space" },
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.3,<0.28",
    "rich>=15.0.0,<16.0",
    "copier>=9.19.1,<10.0",
]

[project.scripts]
merle = "merle.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["merle"]

[tool.uv.sources]
# Falls wir später merle-core für gemeinsame Utilities nutzen wollen

[tool.uv]
package = true
